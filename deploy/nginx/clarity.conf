# /etc/nginx/conf.d/clarity.conf (http context)
gzip_types text/plain text/css application/json application/javascript text/javascript;
gzip_vary on;

# Per client IP. Mobile carriers share IPs (CGNAT), so the rate is loose; the server caps rows per session and project.
limit_req_zone $binary_remote_addr zone=clarity_collect:10m rate=10r/s;
# clarity-js stops recording a page on 429 instead of retrying
limit_req_status 429;
